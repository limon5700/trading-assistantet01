name: Build Android APK & AAB

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using the release keystore from repository secrets."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required with ANDROID_KEYSTORE_BASE64}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required with ANDROID_KEYSTORE_BASE64}"
            KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$STORE_PASSWORD}"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret found - generating a temporary signing keystore for this run."
            STORE_PASSWORD="temporary-store-password"
            KEY_ALIAS="temporary-release"
            KEY_PASSWORD="$STORE_PASSWORD"
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Trading Assistant, OU=Android, O=Trading Assistant, L=Dhaka, C=BD"
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Zipalign and sign release APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          APK_DIR="android/app/build/outputs/apk/release"
          OUT_APK="$APK_DIR/app-signed.apk"

          if [ -f "$APK_DIR/app-release.apk" ]; then
            INPUT_APK="$APK_DIR/app-release.apk"
          elif [ -f "$APK_DIR/app-release-unsigned.apk" ]; then
            INPUT_APK="$APK_DIR/app-release-unsigned.apk"
          else
            echo "::error::No release APK found in $APK_DIR"
            ls -la "$APK_DIR" || true
            exit 1
          fi
          echo "Signing $INPUT_APK"

          # Align before signing: zipalign rewrites the zip, so the signature must come last.
          "$ZIPALIGN" -p -f 4 "$INPUT_APK" "$APK_DIR/app-aligned.apk"
          rm -f "$OUT_APK"
          "$APKSIGNER" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$OUT_APK" \
            "$APK_DIR/app-aligned.apk"

          "$APKSIGNER" verify --print-certs "$OUT_APK"
          echo "Signed and aligned APK: $OUT_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-signed.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
